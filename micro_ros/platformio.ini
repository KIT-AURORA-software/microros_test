[platformio]
; Keep ROS message generation under an ASCII-only path.
libdeps_dir = ${sysenv.HOME}/microros_test/ArduinoUnoR4/.pio/libdeps

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy@5.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-cli
extra_scripts = post:teensy_upload.py
board_microros_distro = humble
board_microros_transport = native_ethernet
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git
